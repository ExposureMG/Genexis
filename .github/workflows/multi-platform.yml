name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Only Linux is built here. Windows and macOS builds need a KDE Craft
# environment (Qt 6.8+ and KDE Frameworks 6 are not available on the stock
# runner images), so they are not part of CI until a Craft-based job exists.

jobs:
  linux:
    name: Linux (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    # Ubuntu 26.04 is the first LTS that ships Qt >= 6.8, KDE Frameworks 6 and
    # CMake >= 3.29, which the build requires.
    container: ubuntu:26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: clang
            cc: clang
            cxx: clang++
          - compiler: gcc
            cc: gcc
            cxx: g++
    env:
      DEBIAN_FRONTEND: noninteractive
      QT_QPA_PLATFORM: offscreen
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      # git must exist before checkout, or actions/checkout falls back to a
      # tarball download without submodules.
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential clang ca-certificates curl git ninja-build \
            pkg-config python3 cmake extra-cmake-modules \
            qt6-base-dev qt6-base-dev-tools qt6-declarative-dev \
            qt6-declarative-dev-tools qt6-serialport-dev \
            libkirigami-dev qml6-module-org-kde-kirigami \
            libkf6i18n-dev libkf6coreaddons-dev libkf6iconthemes-dev \
            libkf6qqc2desktopstyle-dev \
            libftdi1-dev libudev-dev libusb-1.0-0-dev zlib1g-dev libgl-dev

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: CTest
        run: ctest --test-dir build --output-on-failure

      - name: Compiler policy tests
        run: python3 -m unittest discover -s tests -v
